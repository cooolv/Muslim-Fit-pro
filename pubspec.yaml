name: muslim_fit_pro
description: Muslim-Fit-pro — تطبيق تمارين مجاني بالكامل
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/gifs/
    - assets/rig/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
