name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  DEFINES: >-
    --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }}
    --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }}
    --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }}
    --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=android --project-name fitpro --org com.fitpro
      - run: flutter pub get
      - run: flutter build apk --release $DEFINES
      - run: mv build/app/outputs/flutter-apk/app-release.apk FitPro-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: FitPro-Android.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=windows --project-name fitpro --org com.fitpro
      - run: flutter pub get
      - run: flutter build windows --release $env:DEFINES
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath FitPro-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: FitPro-Windows.zip }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
