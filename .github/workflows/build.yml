name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  DEFINES: >-
    --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }}
    --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }}
    --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }}
    --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=android --org com.muslimfit
      - run: flutter pub get
      - run: rm -f flutter_launcher_icons-*.yaml
      - run: dart run flutter_launcher_icons -f tools/icons-android.yaml
      - run: sed -i 's/android:label="[^"]*"/android:label="Muslim-Fit-pro"/' android/app/src/main/AndroidManifest.xml
      - name: Release signing (اختياري)
        if: env.HAS_KS == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload.jks
          cat > android/key.properties <<KP
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$GITHUB_WORKSPACE/android/upload.jks
          KP
          python3 scripts/patch_android.py
      - run: flutter build apk --release $DEFINES
      - name: Build AAB لـ Google Play
        if: env.HAS_KS == 'true'
        run: flutter build appbundle --release $DEFINES
      - run: |
          mkdir out-android
          mv build/app/outputs/flutter-apk/app-release.apk out-android/Muslim-Fit-pro-Android.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then mv build/app/outputs/bundle/release/app-release.aab out-android/Muslim-Fit-pro-PlayStore.aab; fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out-android/* }
  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --platforms=windows --org com.muslimfit
      - run: flutter pub get
      - run: rm -f flutter_launcher_icons-*.yaml
        shell: bash
      - run: dart run flutter_launcher_icons -f tools/icons-windows.yaml
        continue-on-error: true
      - run: sed -i 's/L"muslim_fit_pro"/L"Muslim-Fit-pro"/' windows/runner/main.cpp
        shell: bash
      - run: flutter build windows --release $DEFINES
        shell: bash
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Muslim-Fit-pro-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Muslim-Fit-pro-Windows.zip }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
